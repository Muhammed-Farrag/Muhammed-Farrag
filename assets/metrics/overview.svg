  <rect x="1" y="1" width="848" height="163" rx="8" fill="url(#panel)" stroke="#303b49" stroke-width="2"/>
  <path d="M18 18h28M18 18v18M832 18h-28M832 18v18M18 147h28M18 147v-18M832 147h-28M832 147v-18" fill="none" stroke="#ff1744" stroke-width="2" opacity=".55"/>
