<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">Animated digital spiderweb banner</title>
  <desc id="desc">A red-to-blue spiderweb with twinkling dew and an original pixel spider descending on the right.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4d7fff" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="banner-clip">
      <rect width="900" height="180"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <g fill="none" stroke="url(#fade)" stroke-width="1.1">
      <line x1="450" y1="0" x2="0" y2="0"/>
      <line x1="450" y1="0" x2="14" y2="116"/>
      <line x1="450" y1="0" x2="60" y2="180"/>
      <line x1="450" y1="0" x2="180" y2="180"/>
      <line x1="450" y1="0" x2="270" y2="180"/>
      <line x1="450" y1="0" x2="360" y2="180"/>
      <line x1="450" y1="0" x2="450" y2="180"/>
      <line x1="450" y1="0" x2="540" y2="180"/>
      <line x1="450" y1="0" x2="630" y2="180"/>
      <line x1="450" y1="0" x2="720" y2="180"/>
      <line x1="450" y1="0" x2="840" y2="180"/>
      <line x1="450" y1="0" x2="886" y2="116"/>
      <line x1="450" y1="0" x2="900" y2="0"/>
      <circle cx="450" cy="0" r="60"/>
      <circle cx="450" cy="0" r="110"/>
      <circle cx="450" cy="0" r="165"/>
      <circle cx="450" cy="0" r="225"/>
      <circle cx="450" cy="0" r="290"/>
      <circle cx="450" cy="0" r="360"/>
      <circle cx="450" cy="0" r="440"/>
    </g>

    <g fill="#ff2d55">
      <circle cx="391" cy="13" r="1.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="-0.4s" repeatCount="indefinite"/></circle>
      <circle cx="508" cy="15" r="2.1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.1s" begin="-2.2s" repeatCount="indefinite"/></circle>
      <circle cx="343" cy="38" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.3s" begin="-1.7s" repeatCount="indefinite"/></circle>
      <circle cx="559" cy="38" r="2.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/></circle>
      <circle cx="288" cy="68" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.7s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="613" cy="67" r="1.8"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.8s" begin="-2.6s" repeatCount="indefinite"/></circle>
      <circle cx="229" cy="95" r="2.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle cx="670" cy="96" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.4s" begin="-0.5s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="132" r="1.9"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.1s" begin="-2.1s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="131" r="2.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.9s" begin="-3.7s" repeatCount="indefinite"/></circle>
      <circle cx="116" cy="160" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.2s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle cx="786" cy="159" r="2.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="-0.2s" repeatCount="indefinite"/></circle>
      <circle cx="415" cy="58" r="1.8"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" begin="-2.9s" repeatCount="indefinite"/></circle>
      <circle cx="486" cy="58" r="2.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" begin="-1.8s" repeatCount="indefinite"/></circle>
      <circle cx="385" cy="103" r="2.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.9s" begin="-0.9s" repeatCount="indefinite"/></circle>
      <circle cx="516" cy="104" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" begin="-4.1s" repeatCount="indefinite"/></circle>
      <circle cx="338" cy="145" r="2.1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/></circle>
      <circle cx="565" cy="145" r="1.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" begin="-3.2s" repeatCount="indefinite"/></circle>
      <circle cx="82" cy="91" r="2.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.4s" begin="-2.4s" repeatCount="indefinite"/></circle>
      <circle cx="817" cy="90" r="1.8"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <circle cx="266" cy="21" r="2.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.8s" begin="-3.5s" repeatCount="indefinite"/></circle>
      <circle cx="633" cy="22" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="-1.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Original miniature pixel arachnid and thread -->
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,-55; 0,105; 0,105; 0,-55; 0,-55"
        keyTimes="0;0.35;0.55;0.9;1"
        calcMode="spline"
        keySplines="0.45 0 0.55 1; 0 0 1 1; 0.45 0 0.55 1; 0 0 1 1"
        dur="9s"
        repeatCount="indefinite" />
      <line x1="760" y1="-400" x2="760" y2="2" stroke="#8a94a6" stroke-width="1.2" opacity="0.75"/>
      <g fill="#3d0e1a" shape-rendering="crispEdges">
        <rect x="740" y="8" width="12" height="4"/><rect x="736" y="4" width="8" height="4"/>
        <rect x="768" y="8" width="12" height="4"/><rect x="776" y="4" width="8" height="4"/>
        <rect x="740" y="16" width="12" height="4"/><rect x="732" y="20" width="12" height="4"/>
        <rect x="768" y="16" width="12" height="4"/><rect x="776" y="20" width="12" height="4"/>
        <rect x="740" y="24" width="12" height="4"/><rect x="736" y="28" width="8" height="4"/>
        <rect x="768" y="24" width="12" height="4"/><rect x="776" y="28" width="8" height="4"/>
        <rect x="744" y="32" width="8" height="4"/><rect x="740" y="36" width="8" height="4"/>
        <rect x="768" y="32" width="8" height="4"/><rect x="772" y="36" width="8" height="4"/>
      </g>
      <g fill="#5c1526" shape-rendering="crispEdges">
        <rect x="756" y="2" width="8" height="4"/><rect x="752" y="6" width="16" height="4"/>
        <rect x="752" y="10" width="16" height="4"/><rect x="748" y="14" width="24" height="4"/>
        <rect x="748" y="18" width="24" height="4"/><rect x="748" y="22" width="24" height="4"/>
        <rect x="752" y="26" width="16" height="4"/><rect x="752" y="30" width="16" height="4"/>
        <rect x="756" y="34" width="8" height="4"/>
      </g>
      <rect x="752" y="14" width="4" height="4" fill="#ff2d55"/><rect x="764" y="14" width="4" height="4" fill="#ff2d55"/>
    </g>
  </g>
</svg>
